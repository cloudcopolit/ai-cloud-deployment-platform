# Testing overlay: an isolated project (`cloudpilot-test`) with a throwaway
# database that lives in memory. It runs the automated test suites.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example run --rm backend-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example run --rm frontend-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.example down --volumes

name: cloudpilot-test

services:
  # Own container names so the test project can run next to the development stack.
  db:
    container_name: cloudpilot-test-db
    ports: !reset []
    environment:
      POSTGRES_DB: cloudpilot_test
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  localstack:
    container_name: cloudpilot-test-localstack
    ports: !reset []
    volumes: !reset
      - /var/run/docker.sock:/var/run/docker.sock

  # The application services are not needed to run the test suites.
  migrate:
    profiles: [stack]
  backend:
    profiles: [stack]
  frontend:
    profiles: [stack]

  # Build contexts come from docker-compose.yml (repository root + backend/Dockerfile).
  backend-tests:
    container_name: cloudpilot-test-backend-tests
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cloudpilot_test
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    container_name: cloudpilot-test-frontend-tests
