# CloudPilot Full Stack Docker Compose Orchestration
# Services:
#   db: PostgreSQL 16 with automated healthcheck and test database provisioning
#   localstack: AWS local cloud emulator (STS, IAM, ECS, S3, RDS, SecretsManager)
#   backend: FastAPI monolith running migrations and conditional seed on boot
#   frontend: Next.js 16 App Router UI with Partial Prerendering
#   backend-tests: Test runner service (profile: test) running against *_test DB

name: cloudpilot

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudpilot}:${POSTGRES_PASSWORD:-cloudpilot}@db:5432/${POSTGRES_DB:-cloudpilot}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SEED_DEV_DATA: ${SEED_DEV_DATA:-true}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-at-least-32-characters-long-for-local-development}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dev-github-client-id}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dev-github-client-secret}
  GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

services:
  db:
    image: postgres:16
    container_name: cloudpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpilot}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpilot}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-cloudpilot}\" -d \"$${POSTGRES_DB:-cloudpilot}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:3.7.2
    container_name: cloudpilot-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,sts,ecs,logs,cloudwatch,ec2,elasticloadbalancingv2,secretsmanager,rds
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: cloudpilot-migrate
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head"]
    profiles: [migrate]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: cloudpilot-backend
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: cloudpilot-frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    container_name: cloudpilot-backend-tests
    profiles: [test]
    environment:
      <<: *backend-environment
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudpilot}:${POSTGRES_PASSWORD:-cloudpilot}@db:5432/${POSTGRES_DB:-cloudpilot}_test
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    container_name: cloudpilot-frontend-tests
    profiles: [test]
    volumes:
      - ./frontend/src:/app/src:ro


volumes:
  db-data:
  localstack-data:
