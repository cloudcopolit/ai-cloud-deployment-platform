version: 2

# Version updates target `dev`, following the feature -> dev -> testing -> main
# promotion flow. (Dependabot security updates always target the default branch.)
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /backend
      - /.github
      - /ai
      - /ai/**
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Base images in backend/Dockerfile and frontend/Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  # Images referenced by the root Docker Compose files (PostgreSQL).
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  # Add a `terraform` entry once Terraform configuration exists on the default
  # branch; Dependabot errors on ecosystems that have no manifests.
