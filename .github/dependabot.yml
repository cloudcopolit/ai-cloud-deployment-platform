version: 2

# Version updates target `dev`, following the feature -> dev -> testing -> main
# promotion flow. (Dependabot security updates always target the default branch.)
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /backend
      - /.github
      - /ai
      - /ai/**
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Add a `docker` entry (and a `terraform` entry) once Dockerfiles or Terraform
  # configuration exist on the default branch; Dependabot errors on ecosystems
  # that have no manifests.
