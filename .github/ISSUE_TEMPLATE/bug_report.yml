name: Bug report
description: Report a reproducible problem in the repository.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never include secrets, personal data, or real AWS account details. For security vulnerabilities, follow [the security policy](https://github.com/cloudcopolit/ai-cloud-deployment-platform/blob/main/SECURITY.md) instead.
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Which file, component, or workflow is affected?
      placeholder: e.g. infrastructure/terraform/modules/vpc
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant logs or screenshots with sensitive information removed.
    validations:
      required: false
