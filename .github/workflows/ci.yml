name: CI

on:
  pull_request:
    branches: [dev, testing, main]
  push:
    branches: [dev, testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${CURRENT_SHA}"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${BEFORE_SHA}...${CURRENT_SHA}"
          else
            echo "No previous commit exists to compare; whitespace check skipped."
          fi

  backend:
    name: Python backend (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect backend source
        id: detect
        shell: bash
        run: |
          if find backend -type f -name '*.py' -print -quit | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Python backend source found; checks are skipped for this scaffold."
          fi

      - name: Require backend project and tests
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          test -f backend/pyproject.toml || {
            echo "::error::Python backend source exists, but backend/pyproject.toml is missing. Add project and development dependencies before merging."
            exit 1
          }
          find backend -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q . || {
            echo "::error::Python backend source exists, but no pytest tests were found under backend/."
            exit 1
          }

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint backend
        if: steps.detect.outputs.run == 'true'
        working-directory: backend
        run: ruff check .

      - name: Test backend
        if: steps.detect.outputs.run == 'true'
        working-directory: backend
        run: pytest -q

      - name: Audit backend dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: backend
        run: python -m pip install pip-audit && pip-audit

  ai:
    name: Python AI layer (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect AI source
        id: detect
        shell: bash
        run: |
          if find ai -type f -name '*.py' -print -quit | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Python AI source found; checks are skipped for this scaffold."
          fi

      - name: Require AI project and tests
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          test -f ai/pyproject.toml || {
            echo "::error::Python AI source exists, but ai/pyproject.toml is missing. Add project and development dependencies before merging."
            exit 1
          }
          find ai -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q . || {
            echo "::error::Python AI source exists, but no pytest tests were found under ai/."
            exit 1
          }

      - name: Set up Python
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/pyproject.toml

      - name: Install AI layer and development dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: ai
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint AI layer
        if: steps.detect.outputs.run == 'true'
        working-directory: ai
        run: ruff check .

      - name: Test AI layer
        if: steps.detect.outputs.run == 'true'
        working-directory: ai
        run: pytest -q

      - name: Audit AI dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: ai
        run: python -m pip install pip-audit && pip-audit

  frontend:
    name: React frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect frontend application
        id: detect
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif find frontend -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
            echo "::error::Frontend source exists, but frontend/package.json is missing."
            exit 1
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No React application found; checks are skipped for this scaffold."
          fi

      - name: Require lockfile and quality scripts
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        shell: bash
        run: |
          test -f package-lock.json || {
            echo "::error::Commit frontend/package-lock.json so CI can install reproducible dependencies with npm ci."
            exit 1
          }
          node -e "const p=require('./package.json'); for (const s of ['lint','typecheck','test:ci','build']) if (typeof p.scripts?.[s] !== 'string') { console.error('Missing required package script: ' + s); process.exitCode=1; }"

      - name: Set up Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend
        if: steps.detect.outputs.run == 'true'
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Terraform configuration
        id: detect
        shell: bash
        run: |
          if find infrastructure -type f -name '*.tf' -print -quit | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform configuration found; formatting check is skipped for this scaffold."
          fi

      - name: Set up Terraform
        if: steps.detect.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.detect.outputs.run == 'true'
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate Terraform configurations
        if: steps.detect.outputs.run == 'true'
        shell: bash
        run: |
          mapfile -t terraform_dirs < <(find infrastructure/terraform -type f -name '*.tf' -printf '%h\n' | sort -u)
          for terraform_dir in "${terraform_dirs[@]}"; do
            echo "Validating ${terraform_dir}"
            terraform -chdir="${terraform_dir}" init -backend=false -input=false -no-color
            terraform -chdir="${terraform_dir}" validate -no-color
          done
