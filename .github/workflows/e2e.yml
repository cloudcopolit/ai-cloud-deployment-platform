name: End-to-end

# The isolated E2E suite exactly as developers run it: scripts/e2e.sh builds the stack against
# the fake GitHub server and a throwaway database (ports 3100/8100) and runs every spec in
# frontend/e2e/. No cloud or GitHub credentials exist here; the real-AWS flow
# (scripts/real-flow.sh, frontend/e2e-real/) never runs in CI.

on:
  # every pull request, including stacked PRs whose base is another feature branch
  pull_request:
  push:
    branches: [main, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright against the isolated stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stacked PRs below the frontend PR do not contain the suite yet.
      - name: Detect the E2E suite
        id: detect
        run: |
          if [[ -f scripts/e2e.sh && -f frontend/playwright.config.ts ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/e2e.sh or frontend/playwright.config.ts does not exist on this branch; E2E skipped."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Set up pnpm (version from package.json)
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies and the Playwright browser
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run the E2E suite (scripts/e2e.sh)
        if: steps.detect.outputs.present == 'true'
        run: sh scripts/e2e.sh

      - name: Upload the Playwright report
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
