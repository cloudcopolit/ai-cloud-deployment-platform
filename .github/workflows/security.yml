name: Security

on:
  # every pull request, including stacked PRs whose base is another feature branch
  pull_request:
  push:
    branches: [main, dev, testing]
  schedule:
    # Weekly re-scan of the default branch for newly published advisories.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests scan only the commits they introduce; pushes, the schedule
      # and manual runs scan the full history of the checked-out branch.
      - name: Scan for secrets (Gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            log_opts="HEAD"
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose --log-opts="$log_opts" .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install CI tools
        run: python -m pip install -r .github/requirements-ci.txt

      # Audits the backend and every AI project found by the discovery script.
      - name: Audit Python dependencies (pip-audit)
        run: |
          targets=(backend/requirements.txt)
          while read -r project; do
            [[ -n "$project" ]] || continue
            if [[ -f "$project/pyproject.toml" ]]; then targets+=("$project"); else targets+=("$project/requirements.txt"); fi
          done < <(python .github/scripts/discover_ai_projects.py ai | python -c \
            'import json, sys; [print(p["path"]) for p in json.load(sys.stdin)["projects"]]')
          status=0
          for target in "${targets[@]}"; do
            echo "::group::pip-audit ${target}"
            if [[ -d "$target" ]]; then pip-audit "$target" || status=1; else pip-audit -r "$target" || status=1; fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      # Reviewed exceptions live in frontend/pnpm-workspace.yaml (auditConfig).
      - name: Audit frontend dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level high

  # Static analysis of the source. CodeQL needs GitHub Advanced Security, which this private
  # repository (GitHub Free) does not have; Semgrep runs the equivalent rule packs in a pinned
  # container with metrics off, and any finding fails the job. Reviewed exceptions are inline
  # `nosemgrep: <rule-id>` comments with a reason. e2e/fake_github is a test double that the
  # E2E contract keeps unchanged (it fakes git's SHA-1 object ids), so it is not scanned.
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Python, TypeScript, Dockerfiles and OpenTofu (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b \
            semgrep scan --metrics=off --error --disable-version-check \
              --config p/python --config p/typescript --config p/react \
              --config p/dockerfile --config p/terraform \
              --exclude node_modules --exclude .next --exclude test-runs \
              --exclude e2e/fake_github
