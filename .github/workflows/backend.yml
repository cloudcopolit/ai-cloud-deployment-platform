name: Backend

on:
  pull_request:
    branches: [main, dev, testing]
  push:
    branches: [main, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check --output-format=github .

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Disposable CI-only database; matches the major version in backend/db.yml.
        # Pinned by digest; refresh with `docker buildx imagetools inspect postgres:16`.
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot
          POSTGRES_DB: cloudpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpilot -d cloudpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cloudpilot:cloudpilot@localhost:5432/cloudpilot_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Includes migration checks: single head, upgrade/downgrade round trip,
      # and `alembic check` for model changes that have no migration.
      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing
