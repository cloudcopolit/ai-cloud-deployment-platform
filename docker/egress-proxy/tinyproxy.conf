Port 3128
Listen 0.0.0.0
Timeout 900
MaxClients 64
LogLevel Notice
# clients: private (container) networks only
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS via CONNECT to 443 only; plain HTTP is used for the ALB health check
ConnectPort 443
# deny by default; allow only hosts that match the allowlist (checked for CONNECT too)
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
DisableViaHeader Yes
