# Tool configuration for the backend. Runtime dependencies are pinned in
# requirements.txt and development tooling in requirements-dev.txt.
# Lint and format rules are shared with the AI layer in ../ruff.toml.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
# cloudpilot_ai is the sibling AI package (copied next to app/ in the Docker image).
mypy_path = "../ai/src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
cache_dir = "/tmp/.mypy_cache"

# boto3/botocore ship without type information
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../ai/src"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
